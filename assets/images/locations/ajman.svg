<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ajman skyline — moving services across Ajman">
  <title>Ajman skyline — moving services across Ajman</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a63"/><stop offset="1" stop-color="#3a7ab4"/>
    </linearGradient>
    <linearGradient id="tw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2440" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0b2440" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6ea6"/><stop offset="1" stop-color="#1d4e7c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe6a8" stop-opacity=".34"/>
    <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
  </radialGradient>
  <circle cx="650" cy="130" r="170" fill="url(#haze)"/>
  <g>
    <rect x="34" y="440" width="46" height="160" fill="url(#tw)"/>
    <rect x="90" y="390" width="54" height="210" fill="url(#tw)"/>
    <rect x="154" y="460" width="40" height="140" fill="url(#tw)"/>
    <rect x="204" y="350" width="50" height="250" fill="url(#tw)"/>
    <rect x="264" y="425" width="38" height="175" fill="url(#tw)"/>
    <rect x="312" y="310" width="52" height="290" fill="#f5b21d" opacity=".9"/>
    <rect x="374" y="400" width="44" height="200" fill="url(#tw)"/>
    <rect x="428" y="365" width="58" height="235" fill="url(#tw)"/>
    <rect x="496" y="435" width="40" height="165" fill="url(#tw)"/>
    <rect x="546" y="385" width="50" height="215" fill="url(#tw)"/>
    <rect x="606" y="415" width="44" height="185" fill="url(#tw)"/>
    <rect x="660" y="355" width="56" height="245" fill="url(#tw)"/>
    <rect x="726" y="430" width="42" height="170" fill="url(#tw)"/>
  </g>
  <rect y="600" width="800" height="0" fill="none"/>
  <rect y="498" width="800" height="102" fill="url(#water)"/>
  <g fill="#ffffff" opacity=".14">
    <rect x="40" y="520" width="120" height="4" rx="2"/>
    <rect x="220" y="540" width="180" height="4" rx="2"/>
    <rect x="460" y="524" width="150" height="4" rx="2"/>
    <rect x="120" y="566" width="240" height="4" rx="2"/>
    <rect x="470" y="562" width="200" height="4" rx="2"/>
  </g>
</svg>
