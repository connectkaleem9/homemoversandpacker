<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dubai skyline — moving services across Dubai">
  <title>Dubai skyline — moving services across Dubai</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a63"/><stop offset="1" stop-color="#3a7ab4"/>
    </linearGradient>
    <linearGradient id="tw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2440" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0b2440" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
