<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Moving crew loading wrapped furniture and cartons into a truck with the Dubai skyline behind">
  <title>Movers loading a truck in Dubai</title>

  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#123a63"/>
      <stop offset="0.55" stop-color="#1c5088"/>
      <stop offset="1"   stop-color="#3a7ab4"/>
    </linearGradient>
    <linearGradient id="towerG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a4a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0c2a4a" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf4"/>
      <stop offset="1" stop-color="#cfd8e5"/>
    </linearGradient>
    <linearGradient id="boxG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a95f"/>
      <stop offset="1" stop-color="#c98c3f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="900" fill="url(#skyG)"/>
  <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe6a8" stop-opacity=".38"/>
    <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
  </radialGradient>
  <circle cx="1010" cy="150" r="210" fill="url(#haze)"/>

  <!-- Dubai-style skyline -->
  <g fill="url(#towerG)">
    <path d="M60 640V430l26-14 26 14v210z"/>
    <rect x="130" y="470" width="52" height="170"/>
    <path d="M200 640V380l22-120 22 120v260z"/>
    <rect x="262" y="500" width="44" height="140"/>
    <path d="M322 640V450l30-22 30 22v190z"/>
    <rect x="398" y="520" width="38" height="120"/>
    <!-- tall centrepiece, Burj-like -->
    <path d="M470 640V330l18-190 18 190v310z"/>
    <path d="M452 640V420l18-40 18 40v220z"/>
    <path d="M506 640V440l18-34 18 34v200z"/>
    <rect x="566" y="486" width="46" height="154"/>
    <path d="M628 640V430l28-18 28 18v210z"/>
    <rect x="700" y="510" width="40" height="130"/>
    <path d="M756 640V400l26-16 26 16v240z"/>
    <rect x="826" y="530" width="42" height="110"/>
    <path d="M884 640V450l24-16 24 16v190z"/>
    <rect x="948" y="495" width="50" height="145"/>
    <path d="M1014 640V420l26-18 26 18v220z"/>
    <rect x="1082" y="520" width="60" height="120"/>
  </g>

  <!-- Window glints -->
  <g fill="#ffffff" opacity=".12">
    <rect x="140" y="486" width="32" height="6"/><rect x="140" y="506" width="32" height="6"/>
    <rect x="140" y="526" width="32" height="6"/><rect x="272" y="516" width="24" height="6"/>
    <rect x="272" y="536" width="24" height="6"/><rect x="576" y="502" width="26" height="6"/>
    <rect x="576" y="522" width="26" height="6"/><rect x="710" y="526" width="20" height="6"/>
    <rect x="836" y="546" width="22" height="6"/><rect x="958" y="512" width="30" height="6"/>
    <rect x="958" y="532" width="30" height="6"/><rect x="1092" y="536" width="40" height="6"/>
  </g>

  <!-- Ground -->
  <rect y="640" width="1200" height="260" fill="url(#groundG)"/>
  <rect y="640" width="1200" height="5" fill="#b9c5d6"/>

  <!-- ================= Moving truck ================= -->
  <g>
    <!-- box body -->
    <rect x="560" y="330" width="500" height="290" rx="10" fill="#ffffff"/>
    <rect x="560" y="330" width="500" height="290" rx="10" fill="none" stroke="#c3cfdf" stroke-width="4"/>
    <!-- gold stripe -->
    <rect x="560" y="556" width="500" height="26" fill="#f5b21d"/>

    <!-- branding on the side -->
    <g transform="translate(690 392) scale(1.15)">
      <path d="M28 4 6 22v16h44V22z" fill="#0d2440"/>
      <path d="M28 4 6 22h44z" fill="#f5b21d"/>
      <rect x="21" y="26" width="14" height="12" rx="1.4" fill="#ffffff"/>
    </g>
    <text x="748" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#0d2440">HOME MOVER</text>
    <text x="748" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#f5b21d">AND PAKER</text>
    <text x="750" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600" letter-spacing="4" fill="#5b6b80">MOVERS &amp; PACKERS</text>

    <!-- cab -->
    <path d="M1060 400h78l52 74v146h-130z" fill="#ffffff" stroke="#c3cfdf" stroke-width="4"/>
    <path d="M1072 416h58l40 56h-98z" fill="#a9c6e2"/>
    <rect x="1060" y="556" width="130" height="26" fill="#f5b21d"/>

    <!-- wheels -->
    <circle cx="676" cy="626" r="42" fill="#22303f"/>
    <circle cx="676" cy="626" r="18" fill="#98a5b5"/>
    <circle cx="960" cy="626" r="42" fill="#22303f"/>
    <circle cx="960" cy="626" r="18" fill="#98a5b5"/>
    <circle cx="1130" cy="626" r="42" fill="#22303f"/>
    <circle cx="1130" cy="626" r="18" fill="#98a5b5"/>

    <!-- open rear door / ramp -->
    <path d="M560 620 470 664l6 12 92-44z" fill="#c3cfdf"/>
  </g>

  <!-- ================= Cartons ================= -->
  <g>
    <!-- stack on the ground -->
    <rect x="300" y="500" width="132" height="106" rx="6" fill="url(#boxG)"/>
    <rect x="300" y="536" width="132" height="12" fill="#a9702c" opacity=".55"/>
    <rect x="358" y="500" width="16" height="106" fill="#a9702c" opacity=".35"/>

    <rect x="286" y="600" width="160" height="122" rx="6" fill="url(#boxG)"/>
    <rect x="286" y="642" width="160" height="14" fill="#a9702c" opacity=".55"/>
    <rect x="356" y="600" width="18" height="122" fill="#a9702c" opacity=".35"/>

    <rect x="452" y="612" width="118" height="110" rx="6" fill="url(#boxG)"/>
    <rect x="452" y="650" width="118" height="12" fill="#a9702c" opacity=".55"/>
    <rect x="503" y="612" width="16" height="110" fill="#a9702c" opacity=".35"/>
  </g>

  <!-- ================= Mover, foreground ================= -->
  <g>
    <!-- legs -->
    <path d="M150 700h30l6 122h-32z" fill="#1c4676"/>
    <path d="M196 700h30l10 122h-32z" fill="#16395e"/>
    <rect x="140" y="816" width="52" height="18" rx="7" fill="#22303f"/>
    <rect x="196" y="816" width="52" height="18" rx="7" fill="#22303f"/>
    <!-- torso / overalls -->
    <path d="M142 556h94a14 14 0 0 1 14 14v122a14 14 0 0 1-14 14h-94a14 14 0 0 1-14-14V570a14 14 0 0 1 14-14z" fill="#1c4676"/>
    <rect x="128" y="600" width="122" height="14" fill="#0f2c4c" opacity=".45"/>
    <!-- shirt -->
    <path d="M150 528h78v40h-78z" fill="#ffffff"/>
    <!-- arms holding a carton -->
    <rect x="112" y="560" width="30" height="96" rx="15" fill="#ffffff"/>
    <rect x="236" y="560" width="30" height="96" rx="15" fill="#ffffff"/>
    <circle cx="127" cy="662" r="17" fill="#f0c9a3"/>
    <circle cx="251" cy="662" r="17" fill="#f0c9a3"/>
    <!-- carton being carried -->
    <rect x="104" y="596" width="170" height="86" rx="6" fill="url(#boxG)"/>
    <rect x="104" y="628" width="170" height="12" fill="#a9702c" opacity=".55"/>
    <rect x="180" y="596" width="18" height="86" fill="#a9702c" opacity=".35"/>
    <!-- head + cap -->
    <circle cx="189" cy="492" r="34" fill="#f0c9a3"/>
    <path d="M155 486a34 34 0 0 1 68 0z" fill="#0d2440"/>
    <path d="M223 486h26v9h-26z" fill="#0d2440"/>
  </g>

  <!-- Soft foreground vignette so hero text stays readable on the left -->
  <rect width="440" height="900" fill="url(#skyG)" opacity="0"/>
</svg>
