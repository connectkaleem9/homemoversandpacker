<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Home Movers &amp; Packers">
  <!--
    The brand mark redrawn in solid shapes. The logo's own outlines are too
    thin to survive a 16px favicon, so this keeps the idea — a roof over a
    truck — and rebuilds it in fills. Geometry matches make_icons.py, so this
    and the PNG/ICO rasters are the same picture.
  -->
  <rect width="64" height="64" rx="14" fill="#0d2440"/>

  <!-- roof -->
  <path d="M12 25 32 11 52 25" fill="none" stroke="#ffffff" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- truck: body and cab share one baseline, wheels hang below it. No
       windscreen and no wheel arches — at favicon sizes every extra cut only
       eats the shape. -->
  <rect x="8" y="30" width="24" height="16" rx="2.5" fill="#ffffff"/>
  <path d="M32 35h12l9 7v4H32z" fill="#f5b21d"/>

  <g fill="#0d2440"><circle cx="16.5" cy="47.5" r="5.6"/><circle cx="44" cy="47.5" r="5.6"/></g>
  <g fill="#ffffff"><circle cx="16.5" cy="47.5" r="4.2"/><circle cx="44" cy="47.5" r="4.2"/></g>
  <g fill="#0d2440"><circle cx="16.5" cy="47.5" r="1.7"/><circle cx="44" cy="47.5" r="1.7"/></g>
</svg>
