<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Moving crew wrapping an armchair in protective film inside a home">
  <title>Crew wrapping furniture before a move</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e4eaf3"/>
    </linearGradient>
    <linearGradient id="bx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a95f"/><stop offset="1" stop-color="#c98c3f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#room)"/>

  <!-- window -->
  <rect x="820" y="58" width="230" height="200" rx="6" fill="#cfe0f0" stroke="#b3c4d6" stroke-width="7"/>
  <rect x="931" y="58" width="8" height="200" fill="#b3c4d6"/>
  <rect x="820" y="151" width="230" height="8" fill="#b3c4d6"/>

  <!-- floor -->
  <rect y="392" width="1200" height="108" fill="#d5dde8"/>
  <rect y="392" width="1200" height="5" fill="#c0cbd9"/>

  <!-- plant, left -->
  <path d="M92 392V300" stroke="#3f7d52" stroke-width="9" stroke-linecap="round"/>
  <path d="M92 322c-30-14-41-42-37-68 28 4 49 24 54 52z" fill="#4c9463"/>
  <path d="M92 338c30-18 39-48 32-74-28 7-47 30-51 58z" fill="#3f7d52"/>
  <path d="M66 392h52l-7 40H73z" fill="#e0a95f"/>

  <!-- armchair being wrapped, centre-left -->
  <g>
    <path d="M360 236h236a32 32 0 0 1 32 32v124H328V268a32 32 0 0 1 32-32z" fill="#b9c6d6"/>
    <rect x="328" y="286" width="56" height="106" rx="17" fill="#a7b6c9"/>
    <rect x="572" y="286" width="56" height="106" rx="17" fill="#a7b6c9"/>
    <rect x="380" y="300" width="196" height="62" rx="13" fill="#cdd8e5"/>
    <rect x="352" y="388" width="19" height="30" fill="#8d9cb0"/>
    <rect x="590" y="388" width="19" height="30" fill="#8d9cb0"/>
    <g opacity=".52" fill="#ffffff"><path d="M340 250h288l-36 142H328z"/></g>
    <g opacity=".34" stroke="#ffffff" stroke-width="6" fill="none">
      <path d="M336 272h292M330 314h298M332 356h294"/>
    </g>
  </g>

  <!-- kneeling worker, left of the chair -->
  <g>
    <path d="M188 392h116l-8-54h-100z" fill="#1c4676"/>
    <rect x="180" y="374" width="50" height="19" rx="8" fill="#22303f"/>
    <path d="M209 338h81a12 12 0 0 0 12-12v-56a33 33 0 0 0-33-33h-39a33 33 0 0 0-33 33v56a12 12 0 0 0 12 12z" fill="#1c4676"/>
    <path d="M222 220h56v27h-56z" fill="#ffffff"/>
    <rect x="277" y="252" width="78" height="25" rx="12" fill="#ffffff"/>
    <circle cx="356" cy="264" r="14" fill="#f0c9a3"/>
    <circle cx="250" cy="192" r="29" fill="#f0c9a3"/>
    <path d="M221 188a29 29 0 0 1 58 0z" fill="#0d2440"/>
    <path d="M279 188h21v8h-21z" fill="#0d2440"/>
  </g>

  <!-- cartons, right -->
  <rect x="676" y="272" width="146" height="120" rx="6" fill="url(#bx)"/>
  <rect x="676" y="312" width="146" height="13" fill="#a9702c" opacity=".5"/>
  <rect x="739" y="272" width="18" height="120" fill="#a9702c" opacity=".32"/>

  <rect x="700" y="170" width="112" height="102" rx="6" fill="url(#bx)"/>
  <rect x="700" y="206" width="112" height="12" fill="#a9702c" opacity=".5"/>
  <rect x="748" y="170" width="16" height="102" fill="#a9702c" opacity=".32"/>

  <rect x="838" y="298" width="126" height="94" rx="6" fill="url(#bx)"/>
  <rect x="838" y="330" width="126" height="12" fill="#a9702c" opacity=".5"/>
  <rect x="892" y="298" width="16" height="94" fill="#a9702c" opacity=".32"/>

  <!-- standing worker, far right -->
  <g>
    <path d="M1046 392h26l5 74h-28z" fill="#1c4676"/>
    <path d="M1086 392h26l8 74h-28z" fill="#16395e"/>
    <rect x="1038" y="460" width="46" height="16" rx="6" fill="#22303f"/>
    <rect x="1086" y="460" width="46" height="16" rx="6" fill="#22303f"/>
    <path d="M1040 282h82a12 12 0 0 1 12 12v86a12 12 0 0 1-12 12h-82a12 12 0 0 1-12-12v-86a12 12 0 0 1 12-12z" fill="#1c4676"/>
    <path d="M1048 258h66v30h-66z" fill="#ffffff"/>
    <rect x="1014" y="286" width="26" height="76" rx="13" fill="#ffffff"/>
    <rect x="1122" y="286" width="26" height="76" rx="13" fill="#ffffff"/>
    <circle cx="1027" cy="366" r="14" fill="#f0c9a3"/>
    <circle cx="1135" cy="366" r="14" fill="#f0c9a3"/>
    <circle cx="1081" cy="228" r="29" fill="#f0c9a3"/>
    <path d="M1052 224a29 29 0 0 1 58 0z" fill="#0d2440"/>
    <path d="M1110 224h21v8h-21z" fill="#0d2440"/>
  </g>
</svg>
