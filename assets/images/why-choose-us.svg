<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Moving crew wrapping an armchair in protective film inside a home">
  <title>Crew wrapping furniture before a move</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fa"/><stop offset="1" stop-color="#e2e8f1"/>
    </linearGradient>
    <linearGradient id="bx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a95f"/><stop offset="1" stop-color="#c98c3f"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#room)"/>
  <!-- wall / floor -->
  <rect y="470" width="900" height="230" fill="#d5dde8"/>
  <rect y="470" width="900" height="5" fill="#c0cbd9"/>
  <!-- window -->
  <rect x="612" y="70" width="220" height="230" rx="6" fill="#cfe0f0" stroke="#b3c4d6" stroke-width="7"/>
  <rect x="718" y="70" width="8" height="230" fill="#b3c4d6"/>
  <rect x="612" y="180" width="220" height="8" fill="#b3c4d6"/>
  <!-- plant -->
  <path d="M120 470V360" stroke="#3f7d52" stroke-width="9" stroke-linecap="round"/>
  <path d="M120 386c-32-16-44-46-40-74 30 4 52 26 58 56z" fill="#4c9463"/>
  <path d="M120 404c32-20 42-52 34-80-30 8-50 32-54 62z" fill="#3f7d52"/>
  <path d="M92 470h56l-8 44H100z" fill="#e0a95f"/>

  <!-- armchair being wrapped -->
  <g>
    <path d="M300 300h250a34 34 0 0 1 34 34v136H266V334a34 34 0 0 1 34-34z" fill="#b9c6d6"/>
    <rect x="266" y="352" width="60" height="118" rx="18" fill="#a7b6c9"/>
    <rect x="524" y="352" width="60" height="118" rx="18" fill="#a7b6c9"/>
    <rect x="322" y="368" width="206" height="70" rx="14" fill="#cdd8e5"/>
    <rect x="292" y="462" width="20" height="34" fill="#8d9cb0"/>
    <rect x="538" y="462" width="20" height="34" fill="#8d9cb0"/>
    <!-- protective film sheen -->
    <g opacity=".55" fill="#ffffff">
      <path d="M280 316h300l-40 154H266z"/>
    </g>
    <g opacity=".35" stroke="#ffffff" stroke-width="6" fill="none">
      <path d="M276 340h306M270 384h312M272 428h308"/>
    </g>
  </g>

  <!-- cartons -->
  <rect x="640" y="352" width="150" height="118" rx="6" fill="url(#bx)"/>
  <rect x="640" y="392" width="150" height="13" fill="#a9702c" opacity=".5"/>
  <rect x="705" y="352" width="18" height="118" fill="#a9702c" opacity=".32"/>
  <rect x="672" y="248" width="118" height="104" rx="6" fill="url(#bx)"/>
  <rect x="672" y="286" width="118" height="12" fill="#a9702c" opacity=".5"/>
  <rect x="722" y="248" width="16" height="104" fill="#a9702c" opacity=".32"/>

  <!-- kneeling worker -->
  <g>
    <path d="M148 470h120l-8-56h-104z" fill="#1c4676"/>
    <rect x="140" y="452" width="52" height="20" rx="8" fill="#22303f"/>
    <path d="M170 414h84a12 12 0 0 0 12-12v-58a34 34 0 0 0-34-34h-40a34 34 0 0 0-34 34v58a12 12 0 0 0 12 12z" fill="#1c4676"/>
    <path d="M184 292h58v28h-58z" fill="#ffffff"/>
    <rect x="240" y="326" width="80" height="26" rx="13" fill="#ffffff"/>
    <circle cx="322" cy="339" r="15" fill="#f0c9a3"/>
    <circle cx="213" cy="262" r="30" fill="#f0c9a3"/>
    <path d="M183 258a30 30 0 0 1 60 0z" fill="#0d2440"/>
    <path d="M243 258h22v8h-22z" fill="#0d2440"/>
  </g>
</svg>
